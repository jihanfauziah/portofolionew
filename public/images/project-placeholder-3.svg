<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232328" />
      <stop offset="50%" stop-color="#18181C" />
      <stop offset="100%" stop-color="#0E0E11" />
    </linearGradient>
    <linearGradient id="dark-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E875AC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#087A4B" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg-3)" />

  <!-- Diagonal Tech Hatch Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5">
    <line x1="0" y1="0" x2="500" y2="500" />
    <line x1="100" y1="0" x2="600" y2="500" />
    <line x1="200" y1="0" x2="700" y2="500" />
    <line x1="300" y1="0" x2="800" y2="500" />
  </g>

  <!-- Stylized App Wireframe Card -->
  <g transform="translate(390, 95)">
    <rect width="350" height="270" rx="8" fill="#1C1C22" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <!-- App Header -->
    <rect width="350" height="40" rx="8" fill="#25252D" />
    <rect x="20" y="14" width="50" height="12" rx="3" fill="#E875AC" opacity="0.9" />
    <rect x="80" y="15" width="40" height="10" rx="2" fill="rgba(255,255,255,0.2)" />
    <rect x="130" y="15" width="40" height="10" rx="2" fill="rgba(255,255,255,0.2)" />
    <circle cx="325" cy="20" r="10" fill="#087A4B" />

    <!-- Dashboard layout wireframes -->
    <rect x="20" y="58" width="95" height="55" rx="5" fill="rgba(232, 117, 172, 0.1)" stroke="rgba(232, 117, 172, 0.25)" stroke-width="1" />
    <rect x="30" y="70" width="40" height="8" rx="2" fill="#E875AC" opacity="0.7" />
    <rect x="30" y="85" width="60" height="14" rx="2" fill="#FFFFFF" opacity="0.8" />

    <rect x="127" y="58" width="95" height="55" rx="5" fill="rgba(8, 122, 75, 0.1)" stroke="rgba(8, 122, 75, 0.25)" stroke-width="1" />
    <rect x="137" y="70" width="40" height="8" rx="2" fill="#087A4B" opacity="0.7" />
    <rect x="137" y="85" width="60" height="14" rx="2" fill="#FFFFFF" opacity="0.8" />

    <rect x="234" y="58" width="95" height="55" rx="5" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <rect x="244" y="70" width="40" height="8" rx="2" fill="#FFFFFF" opacity="0.4" />
    <rect x="244" y="85" width="60" height="14" rx="2" fill="#FFFFFF" opacity="0.8" />

    <!-- Table / List mock -->
    <rect x="20" y="128" width="309" height="115" rx="5" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <line x1="20" y1="160" x2="329" y2="160" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <line x1="20" y1="195" x2="329" y2="195" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <rect x="35" y="140" width="80" height="8" rx="2" fill="rgba(255,255,255,0.3)" />
    <rect x="35" y="172" width="120" height="8" rx="2" fill="rgba(255,255,255,0.5)" />
    <rect x="35" y="207" width="100" height="8" rx="2" fill="rgba(255,255,255,0.5)" />
    <circle cx="300" cy="176" r="5" fill="#34D399" />
    <circle cx="300" cy="211" r="5" fill="#E875AC" />
  </g>

  <!-- Left: Content Information & Starburst -->
  <g transform="translate(60, 130)">
    <!-- Category Badge -->
    <rect width="130" height="28" rx="14" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
    <text x="65" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PROJECT JIHAN 03</text>

    <!-- Project Title -->
    <text x="0" y="75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Web Application</text>
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#B4B4BC">Fullstack & Interactive • Modern Web</text>

    <!-- Starburst decoration -->
    <g transform="translate(0, 145)">
      <polygon points="25,0 28,15 42,11 34,23 48,29 34,35 42,47 28,43 25,58 22,43 8,47 16,35 2,29 16,23 8,11 22,15" fill="#E875AC" opacity="0.8" />
      <polygon points="25,0 28,15 42,11 34,23 48,29 34,35 42,47 28,43 25,58 22,43 8,47 16,35 2,29 16,23 8,11 22,15" fill="#087A4B" opacity="0.6" transform="translate(20, -10) scale(0.7)" />
      <text x="60" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Siap diisi detail proyek Jihan Fauziah</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="494" width="800" height="6" fill="url(#dark-accent)" />
</svg>
