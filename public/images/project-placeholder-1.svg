<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261622" />
      <stop offset="50%" stop-color="#1A1017" />
      <stop offset="100%" stop-color="#120A10" />
    </linearGradient>
    <linearGradient id="pink-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E875AC" />
      <stop offset="100%" stop-color="#FFA8D3" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg-1)" />

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(232, 117, 172, 0.08)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Stylized Browser Window Preview Frame -->
  <g transform="translate(380, 90)">
    <rect width="360" height="280" rx="8" fill="#1E141D" stroke="rgba(232, 117, 172, 0.25)" stroke-width="1.5" />
    <!-- Window Bar -->
    <rect width="360" height="32" rx="8" fill="#2D1D2C" />
    <circle cx="20" cy="16" r="4" fill="#FF5F56" />
    <circle cx="34" cy="16" r="4" fill="#FFBD2E" />
    <circle cx="48" cy="16" r="4" fill="#27C93F" />
    <rect x="70" y="9" width="160" height="14" rx="4" fill="rgba(255,255,255,0.08)" />

    <!-- Mock Content Wireframes -->
    <rect x="24" y="52" width="140" height="18" rx="3" fill="#E875AC" opacity="0.8" />
    <rect x="24" y="80" width="220" height="10" rx="2" fill="rgba(255,255,255,0.2)" />
    <rect x="24" y="98" width="180" height="10" rx="2" fill="rgba(255,255,255,0.15)" />

    <rect x="24" y="130" width="95" height="110" rx="4" fill="rgba(232, 117, 172, 0.12)" stroke="rgba(232, 117, 172, 0.25)" stroke-width="1" />
    <rect x="132" y="130" width="95" height="110" rx="4" fill="rgba(232, 117, 172, 0.12)" stroke="rgba(232, 117, 172, 0.25)" stroke-width="1" />
    <rect x="240" y="130" width="95" height="110" rx="4" fill="rgba(232, 117, 172, 0.12)" stroke="rgba(232, 117, 172, 0.25)" stroke-width="1" />
  </g>

  <!-- Left: Content Information & Starburst -->
  <g transform="translate(60, 130)">
    <!-- Category Badge -->
    <rect width="130" height="28" rx="14" fill="rgba(232, 117, 172, 0.15)" stroke="#E875AC" stroke-width="1" />
    <text x="65" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#E875AC" text-anchor="middle" letter-spacing="1.5">PROJECT JIHAN 01</text>

    <!-- Project Title -->
    <text x="0" y="75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Web Project</text>
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#D6BAC8">Frontend Development • Next.js • React</text>

    <!-- Starburst decoration -->
    <g transform="translate(0, 145)">
      <polygon points="25,0 28,15 42,11 34,23 48,29 34,35 42,47 28,43 25,58 22,43 8,47 16,35 2,29 16,23 8,11 22,15" fill="#E875AC" opacity="0.8" />
      <text x="60" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Siap diisi detail proyek Jihan Fauziah</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="494" width="800" height="6" fill="url(#pink-accent)" />
</svg>
