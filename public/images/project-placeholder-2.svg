<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E281C" />
      <stop offset="50%" stop-color="#091B13" />
      <stop offset="100%" stop-color="#05100B" />
    </linearGradient>
    <linearGradient id="green-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087A4B" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg-2)" />

  <!-- Subtle Concentric Circular Accents -->
  <g stroke="rgba(8, 122, 75, 0.15)" stroke-width="1.5" fill="none">
    <circle cx="560" cy="250" r="180" />
    <circle cx="560" cy="250" r="130" />
    <circle cx="560" cy="250" r="80" />
  </g>

  <!-- Stylized UI Component Frame -->
  <g transform="translate(390, 95)">
    <rect width="350" height="270" rx="8" fill="#132E22" stroke="rgba(8, 122, 75, 0.4)" stroke-width="1.5" />
    <rect width="350" height="36" rx="8" fill="#1B3D2E" />
    <circle cx="20" cy="18" r="4" fill="#34D399" opacity="0.8" />
    <text x="35" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#A7F3D0" letter-spacing="1">UI COMPONENT PREVIEW</text>

    <!-- Component wireframes -->
    <rect x="24" y="55" width="302" height="65" rx="6" fill="rgba(8, 122, 75, 0.25)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />
    <circle cx="55" cy="87" r="18" fill="#087A4B" />
    <rect x="88" y="75" width="120" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="88" y="92" width="80" height="8" rx="2" fill="#A7F3D0" opacity="0.6" />

    <rect x="24" y="135" width="145" height="105" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="36" y="150" width="80" height="10" rx="2" fill="#34D399" opacity="0.7" />
    <rect x="36" y="168" width="110" height="8" rx="2" fill="rgba(255,255,255,0.2)" />
    <rect x="36" y="182" width="95" height="8" rx="2" fill="rgba(255,255,255,0.15)" />

    <rect x="181" y="135" width="145" height="105" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="193" y="150" width="80" height="10" rx="2" fill="#34D399" opacity="0.7" />
    <rect x="193" y="168" width="110" height="8" rx="2" fill="rgba(255,255,255,0.2)" />
    <rect x="193" y="182" width="95" height="8" rx="2" fill="rgba(255,255,255,0.15)" />
  </g>

  <!-- Left: Content Information & Starburst -->
  <g transform="translate(60, 130)">
    <!-- Category Badge -->
    <rect width="130" height="28" rx="14" fill="rgba(8, 122, 75, 0.2)" stroke="#087A4B" stroke-width="1" />
    <text x="65" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="1.5">PROJECT JIHAN 02</text>

    <!-- Project Title -->
    <text x="0" y="75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Frontend UI</text>
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#A7D6C1">Responsive Layout • HTML5 • CSS3</text>

    <!-- Starburst decoration -->
    <g transform="translate(0, 145)">
      <polygon points="25,0 28,15 42,11 34,23 48,29 34,35 42,47 28,43 25,58 22,43 8,47 16,35 2,29 16,23 8,11 22,15" fill="#087A4B" opacity="0.8" />
      <text x="60" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Siap diisi detail proyek Jihan Fauziah</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="494" width="800" height="6" fill="url(#green-accent)" />
</svg>
